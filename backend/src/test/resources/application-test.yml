spring:
  datasource:
    url: jdbc:h2:mem:familyapp;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;TIME ZONE=UTC
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate.jdbc.time_zone: UTC
app:
  security:
    jwt:
      secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      expiration-seconds: 3600
