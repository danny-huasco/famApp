name: Backend CI

on:
  push:
    branches:
      - staging
      - main
  pull_request:
    branches:
      - staging
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Java 21 backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: backend/**/*.gradle*

      - name: Run backend tests
        working-directory: backend
        run: bash ./gradlew test --no-daemon
